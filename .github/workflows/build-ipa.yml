name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -project TemplateiOS.xcodeproj \
            -scheme release \
            -configuration Release \
            -archivePath build/TheFeather.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/TheFeather.xcarchive/Products/Applications/*.app Payload/
          zip -r TheFeather.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheFeather-ipa
          path: TheFeather.ipa
          retention-days: 30
